name: Docker lab CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Check HTTP contracts
        run: python -m unittest -v test_app
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and wait for container health
        run: docker compose up --build --wait --wait-timeout 120
      - name: Check container HTTP responses
        run: python smoke_test.py
      - name: Check non-root container user
        run: test "$(docker compose exec -T web id -u)" = "10001"
      - name: Show container logs
        if: always()
        run: docker compose logs --no-color
      - name: Clean up
        if: always()
        run: docker compose down --remove-orphans
